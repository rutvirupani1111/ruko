<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>State Bank Online Banking Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Test fixture: a fake bank login page, served for lookalike hostnames that
         Chromium resolves to 127.0.0.1 via --host-resolver-rules. -->
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #eef3fb;
      }
      header {
        background: #1a3d8f;
        color: #fff;
        padding: 18px 32px;
        font-size: 22px;
        font-weight: bold;
      }
      main {
        max-width: 420px;
        margin: 48px auto;
        background: #fff;
        padding: 28px;
        border-radius: 8px;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.12);
      }
      label {
        display: block;
        margin: 12px 0 4px;
        font-size: 14px;
      }
      input {
        width: 100%;
        padding: 10px;
        border: 1px solid #b8c4dc;
        border-radius: 4px;
        box-sizing: border-box;
      }
      button {
        margin-top: 18px;
        width: 100%;
        padding: 12px;
        background: #1a3d8f;
        color: #fff;
        border: 0;
        border-radius: 4px;
        font-size: 16px;
      }
    </style>
  </head>
  <body>
    <header>Online Banking: KYC Update</header>
    <main>
      <h2>Complete your KYC to avoid account suspension</h2>
      <form onsubmit="return false">
        <label for="user">Username</label>
        <input id="user" autocomplete="off" />
        <label for="pass">Password</label>
        <input id="pass" type="password" autocomplete="off" />
        <label for="otp">OTP</label>
        <input id="otp" autocomplete="off" />
        <button type="submit">Login and update KYC</button>
      </form>
    </main>
  </body>
</html>
